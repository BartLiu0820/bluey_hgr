<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手势小狗四玩法大厅 · 产品架构图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   v3 — Luxury Technical Publication
   Warm cream canvas · Earth-tone accents · Editorial serif display
   ========================================================================== */

:root {
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;

  --f-display: 'Fraunces', Georgia, serif;
  --f-body: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --f-mono: 'Fira Code', 'SF Mono', Consolas, monospace;

  /* Warm neutral palette — cream paper feel */
  --cream: #FAF9F6;
  --cream-dark: #F3F1EC;
  --paper: #FFFFFF;
  --ink-50: #F7F5F0;
  --ink-100: #EBE8E1;
  --ink-150: #DDD9CF;
  --ink-200: #CEC9BD;
  --ink-300: #AFA89A;
  --ink-400: #8F8778;
  --ink-500: #706858;
  --ink-600: #574F42;
  --ink-700: #403A30;
  --ink-800: #2C2720;
  --ink-900: #1B1814;

  --hero-bg: #1B1814;
  --hero-surface: #252119;

  /* Earth-tone accents — 6 layer colors */
  --earth-olive: #5F6B4E;
  --earth-terra: #B86B4A;
  --earth-slate: #627084;
  --earth-amber: #C49A3C;
  --earth-sage: #7A9E7E;
  --earth-plum: #8B6B7E;

  /* Risk — warm-shifted */
  --rH: #C84B3A; --rH-bg: #FDF3F1; --rH-bdr: #F0C5BE;
  --rM: #C87D2E; --rM-bg: #FDF7F0; --rM-bdr: #F0D9B8;
  --rL: #B8A033; --rL-bg: #FDFBF0; --rL-bdr: #EDE0A8;

  --P0: #403A30; --P0-bg: #F0EDE6;
  --P1: #706858; --P1-bg: #F5F3EE;
  --P2: #AFA89A; --P2-bg: #FAF9F6;

  --cDep: #627084;
  --cFlow: #7A9E7E;
  --cCall: #C49A3C;

  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-pill:999px;

  --sh-xs: 0 1px 2px rgba(27,24,20,0.04);
  --sh-sm: 0 1px 4px rgba(27,24,20,0.06), 0 1px 2px rgba(27,24,20,0.03);
  --sh-md: 0 4px 12px -2px rgba(27,24,20,0.08), 0 2px 4px rgba(27,24,20,0.03);
  --sh-lg: 0 12px 32px -4px rgba(27,24,20,0.1), 0 4px 8px rgba(27,24,20,0.02);
  --sh-xl: 0 24px 48px -8px rgba(27,24,20,0.12);
  --sh-warm-glow: 0 8px 24px -4px rgba(184,107,74,0.12);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--f-body);
  color: var(--ink-800);
  background: var(--cream);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 9000;
  opacity: 0.3;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}

/* ====================================================================
   HERO
   ==================================================================== */
.hero {
  background: var(--hero-bg);
  color: var(--cream);
  padding: var(--s10) var(--s8) var(--s12);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -80px; right: 10%;
  width: 360px; height: 360px;
  background: radial-gradient(circle, rgba(184,107,74,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: -60px; left: 15%;
  width: 280px; height: 280px;
  background: radial-gradient(circle, rgba(122,158,126,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.hero-inner {
  position: relative; z-index: 1;
  max-width: 1080px; margin: 0 auto;
}

.hero-brow {
  font-family: var(--f-mono);
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--earth-terra);
  margin-bottom: var(--s3);
  opacity: 0; animation: riseIn .6s var(--ease) .1s forwards;
}

.hero-title {
  font-family: var(--f-display);
  font-size: 36px; font-weight: 800;
  letter-spacing: -0.025em; line-height: 1.15;
  color: var(--cream);
  opacity: 0; animation: riseIn .6s var(--ease) .2s forwards;
}

.hero-subtitle {
  font-family: var(--f-display);
  font-weight: 400; font-style: italic;
  font-size: 15px; color: var(--ink-300);
  margin-top: var(--s2);
  opacity: 0; animation: riseIn .6s var(--ease) .25s forwards;
}

.hero-rule {
  width: 48px; height: 2px;
  background: var(--earth-terra);
  margin: var(--s5) 0;
  border: none; border-radius: 1px;
  opacity: 0; animation: riseIn .6s var(--ease) .3s forwards;
}

.hero-metrics {
  display: flex; gap: var(--s8);
  opacity: 0; animation: riseIn .6s var(--ease) .4s forwards;
}

.hero-metric { text-align: left; }

.hero-metric-val {
  font-family: var(--f-display);
  font-size: 32px; font-weight: 900;
  color: var(--cream);
  letter-spacing: -0.02em;
  line-height: 1;
}

.hero-metric-val.warn { color: var(--earth-terra); }

.hero-metric-lbl {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500;
  color: var(--ink-400);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: var(--s1);
}

.hero-chips {
  display: flex; gap: var(--s2); flex-wrap: wrap;
  margin-top: var(--s5);
  opacity: 0; animation: riseIn .6s var(--ease) .55s forwards;
}

.hero-chip {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 600;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 150ms ease;
}

.hero-chip:hover { transform: translateY(-1px); }

.hero-chip.high {
  background: rgba(200,75,58,0.15); color: #F0A89E;
  border: 1px solid rgba(200,75,58,0.3);
}

.hero-chip.med {
  background: rgba(200,125,46,0.12); color: #F0C888;
  border: 1px solid rgba(200,125,46,0.25);
}

.hero-chip.more {
  background: rgba(175,168,154,0.1); color: var(--ink-300);
  border: 1px solid rgba(175,168,154,0.25);
  cursor: default;
}

@keyframes riseIn {
  from { opacity:0; transform:translateY(14px); }
  to { opacity:1; transform:translateY(0); }
}

.bridge {
  height: 48px;
  background: linear-gradient(to bottom, var(--hero-bg), var(--cream));
}

/* ====================================================================
   OVERVIEW SECTION
   ==================================================================== */
.ov-section {
  max-width: 1080px;
  margin: 0 auto;
  padding: var(--s4) var(--s8) var(--s5);
}

.ov-section-label {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-400);
  margin-bottom: var(--s4);
  display: flex; align-items: center; gap: var(--s3);
}

.ov-section-label::after {
  content: '';
  flex: 1; height: 1px;
  background: var(--ink-100);
}

.ov-layer-row {
  display: flex; align-items: flex-start; gap: var(--s3);
  margin-bottom: 6px;
}

.ov-layer-label {
  font-family: var(--f-mono);
  font-size: 9.5px; font-weight: 600;
  color: var(--ink-500);
  width: 80px; min-width: 80px;
  padding-top: 5px; padding-right: var(--s2);
  text-align: right; line-height: 1.35;
  border-right: 2px solid var(--ink-100);
  letter-spacing: -0.005em; word-break: break-all;
}

.ov-mods-grid {
  display: grid;
  grid-template-columns: repeat(var(--ov-cols, 4), 1fr);
  gap: 5px;
  flex: 1;
}

.ov-mod-card {
  background: var(--paper);
  border: 1px solid var(--ink-100);
  border-left: 3px solid var(--ink-150);
  border-radius: 5px;
  padding: 5px 7px;
}

.ov-mod-card.risk-high { border-left-color: var(--rH); }
.ov-mod-card.risk-medium { border-left-color: var(--rM); }
.ov-mod-card.risk-low { border-left-color: var(--rL); }

.ov-mod-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 4px;
  margin-bottom: 3px;
}

.ov-mod-name {
  font-family: var(--f-body);
  font-size: 11px; font-weight: 700;
  color: var(--ink-900);
  line-height: 1.3; letter-spacing: -0.01em;
  flex: 1;
}

.ov-badge {
  font-family: var(--f-mono);
  font-size: 8px; font-weight: 700;
  padding: 1px 5px; border-radius: var(--r-pill);
  white-space: nowrap; flex-shrink: 0;
  letter-spacing: 0.02em;
}

.ov-badge-p0 { background: var(--P0-bg); color: var(--P0); border: 1px solid var(--ink-200); }
.ov-badge-p1 { background: var(--P1-bg); color: var(--P1); border: 1px solid var(--ink-150); }
.ov-badge-p2 { background: var(--P2-bg); color: var(--P2); border: 1px solid var(--ink-150); }

.ov-sub-item {
  font-family: var(--f-body);
  font-size: 9.5px; color: var(--ink-400);
  line-height: 1.5;
  padding-left: 8px;
  position: relative;
}

.ov-sub-item::before {
  content: '·';
  position: absolute; left: 1px;
  color: var(--ink-200);
}

.ov-detail-head {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-300);
  max-width: 1080px; margin: 0 auto;
  padding: var(--s3) var(--s8) var(--s1);
  border-top: 1px solid var(--ink-100);
}

/* ====================================================================
   TOOLBAR — warm frosted glass
   ==================================================================== */
.toolbar {
  position: sticky; top: 0; z-index: 200;
  min-height: 48px; padding: var(--s2) var(--s8);
  display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  background: rgba(250,249,246,0.82);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid var(--ink-100);
}

.tb-search { position: relative; }

.tb-search input {
  font-family: var(--f-body);
  width: 180px; height: 32px;
  padding: 0 var(--s3) 0 30px;
  border: 1px solid var(--ink-150);
  border-radius: var(--r-pill);
  background: var(--paper);
  font-size: 12px; color: var(--ink-700);
  outline: none; transition: all 250ms var(--ease);
}

.tb-search input::placeholder { color: var(--ink-300); }

.tb-search input:focus {
  width: 230px; border-color: var(--earth-terra);
  box-shadow: 0 0 0 3px rgba(184,107,74,0.1);
}

.tb-search svg {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: var(--ink-300); pointer-events: none;
}

.tb-group {
  display: flex; gap: 3px; align-items: center;
}

.tb-lbl {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500; color: var(--ink-400);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-right: var(--s1);
}

.pill {
  font-family: var(--f-mono);
  height: 26px; padding: 0 10px;
  border-radius: var(--r-pill);
  border: 1px solid var(--ink-150);
  background: var(--paper);
  font-size: 10px; font-weight: 600; color: var(--ink-500);
  cursor: pointer; transition: all 150ms ease;
  display: inline-flex; align-items: center; gap: 4px;
}

.pill:hover { border-color: var(--ink-200); background: var(--ink-50); }

.pill.on {
  background: var(--ink-800); border-color: var(--ink-800);
  color: var(--cream);
}

.pill.on-h { background: var(--rH); border-color: var(--rH); color: var(--cream); }
.pill.on-m { background: var(--rM); border-color: var(--rM); color: var(--cream); }
.pill.on-l { background: var(--rL); border-color: var(--rL); color: var(--ink-900); }

.tb-right {
  display: flex; gap: var(--s2); align-items: center; margin-left: auto;
}

.tb-zoom {
  display: flex; align-items: center;
  background: var(--paper); border: 1px solid var(--ink-150);
  border-radius: var(--r-sm); padding: 2px;
}

.tb-zbtn {
  width: 26px; height: 26px; border: none; border-radius: var(--r-sm);
  background: transparent; color: var(--ink-600); font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

.tb-zbtn:hover { background: var(--ink-50); }

.tb-zval {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 600; color: var(--ink-400);
  min-width: 34px; text-align: center;
}

.tb-export {
  font-family: var(--f-mono);
  height: 30px; padding: 0 14px;
  border: none; border-radius: var(--r-sm);
  background: var(--ink-800); color: var(--cream);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer; transition: all 150ms ease;
  display: flex; align-items: center; gap: var(--s1);
}

.tb-export:hover {
  background: var(--ink-900);
  box-shadow: 0 4px 12px rgba(27,24,20,0.2);
  transform: translateY(-1px);
}

.tb-risk {
  font-family: var(--f-mono);
  height: 30px; padding: 0 12px;
  border: 1px solid var(--ink-150);
  border-radius: var(--r-sm);
  background: var(--paper); color: var(--ink-700);
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer; transition: all 150ms ease;
  display: flex; align-items: center; gap: var(--s2);
  position: relative;
}

.tb-risk:hover {
  border-color: var(--earth-terra);
  background: var(--ink-50);
}

.tb-risk.has-h {
  border-color: var(--rH);
  color: var(--rH);
}

.tb-risk.has-h:hover {
  background: var(--rH-bg);
}

.tb-risk-badge {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 700;
  padding: 1px 6px;
  border-radius: var(--r-pill);
  background: var(--ink-100);
  color: var(--ink-700);
  min-width: 18px; text-align: center;
}

.tb-risk.has-h .tb-risk-badge {
  background: var(--rH); color: var(--cream);
}

/* ====================================================================
   CANVAS
   ==================================================================== */
.canvas-wrap { position: relative; }

.canvas {
  max-width: 1080px;
  margin: 0 auto;
  padding: var(--s6) var(--s8) 80px;
  transform-origin: top center;
  min-width: fit-content;
  position: relative;
  z-index: 2;
}

/* ====================================================================
   LAYER
   ==================================================================== */
.layer {
  margin-bottom: var(--s5);
  padding: var(--s5) var(--s5) var(--s5) var(--s6);
  background: var(--paper);
  border-radius: var(--r-lg);
  border: 1px solid var(--ink-100);
  border-left: 4px solid var(--ink-200);
  box-shadow: var(--sh-sm);
  opacity: 0;
  animation: layerUp .5s var(--ease) forwards;
}

@keyframes layerUp {
  from { opacity:0; transform:translateY(18px); }
  to { opacity:1; transform:translateY(0); }
}

.layer-head {
  display: flex; align-items: baseline; gap: var(--s3);
  margin-bottom: var(--s4);
  padding-bottom: var(--s3);
  border-bottom: 1px solid var(--ink-100);
}

.layer-name {
  font-family: var(--f-display);
  font-size: 15px; font-weight: 800;
  color: var(--ink-800);
  letter-spacing: -0.01em;
}

.layer-tag {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500;
  color: var(--ink-300);
  letter-spacing: 0.04em;
}

/* ====================================================================
   MODULE GRID
   ==================================================================== */
.mgrid {
  display: grid;
  grid-template-columns: repeat(var(--cols,4), 1fr);
  gap: var(--s3);
}

/* ====================================================================
   MODULE CARD
   ==================================================================== */
.card {
  background: var(--paper);
  border-radius: var(--r-md);
  border: 1px solid var(--ink-100);
  padding: var(--s4);
  position: relative;
  transition:
    box-shadow 300ms var(--ease),
    transform 300ms var(--ease),
    border-color 200ms ease,
    opacity 250ms ease;
  box-shadow: var(--sh-xs);
  opacity: 0;
  animation: cardPop .4s var(--ease) forwards;
  cursor: pointer;
  display: flex; flex-direction: column;
}

@keyframes cardPop {
  from { opacity:0; transform:translateY(10px) scale(0.97); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.card:hover {
  box-shadow: var(--sh-lg), var(--sh-warm-glow);
  transform: translateY(-3px);
  border-color: var(--ink-200);
}

.card.risk-high { border-left: 3px solid var(--rH); }
.card.risk-medium { border-left: 3px solid var(--rM); }
.card.risk-low { border-left: 3px solid var(--rL); }

.card-top {
  display: flex; align-items: flex-start; gap: var(--s2);
  margin-bottom: var(--s1);
}

.card-icon {
  font-size: 12px; flex-shrink: 0; margin-top: 2px;
}

.card-name {
  font-family: var(--f-body);
  font-size: 14px; font-weight: 800; color: var(--ink-900);
  flex: 1; line-height: 1.35; letter-spacing: -0.01em;
}

.card-gear {
  font-size: 11px; color: var(--earth-amber);
  flex-shrink: 0; margin-top: 2px;
  cursor: help;
}

.card-desc {
  font-size: 12px; color: var(--ink-400); line-height: 1.55;
  margin-bottom: var(--s2);
}

/* Priority / status badge */
.badge {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: var(--r-pill);
  display: inline-flex; align-items: center;
  white-space: nowrap; flex-shrink: 0; letter-spacing: 0.03em;
}

.badge-p0 { background: var(--P0-bg); color: var(--P0); border: 1px solid var(--ink-200); }
.badge-p1 { background: var(--P1-bg); color: var(--P1); border: 1px solid var(--ink-150); }
.badge-p2 { background: var(--P2-bg); color: var(--P2); border: 1px solid var(--ink-150); }

.badge-stable { background: #F0F7F1; color: #4A7C5A; border: 1px solid #C5DFC9; }
.badge-developing { background: #F0F4FA; color: #4A6A8C; border: 1px solid #C0D2E8; }
.badge-planned { background: var(--ink-50); color: var(--ink-400); border: 1px solid var(--ink-150); }
.badge-deprecated { background: var(--rH-bg); color: var(--rH); border: 1px solid var(--rH-bdr); text-decoration: line-through; }

/* Priority reason — Fraunces italic */
.reason {
  font-family: var(--f-display);
  font-style: italic; font-weight: 400;
  font-size: 11.5px; line-height: 1.5;
  color: var(--ink-500);
  margin-top: var(--s1); margin-bottom: var(--s2);
  padding-left: var(--s2);
  border-left: 2px solid var(--ink-100);
}

.reason::before {
  content: '理由 — ';
  font-family: var(--f-mono);
  font-style: normal; font-weight: 600;
  font-size: 9px;
  color: var(--ink-300);
  letter-spacing: 0.06em;
}

/* Entities / Metrics info blocks */
.info-block {
  margin-top: var(--s2);
  display: flex; align-items: flex-start; gap: var(--s2);
  flex-wrap: wrap;
}

.info-label {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 600;
  color: var(--ink-400);
  text-transform: uppercase; letter-spacing: 0.08em;
  flex-shrink: 0; padding-top: 3px;
  min-width: 42px;
}

.info-chips {
  display: flex; gap: 4px; flex-wrap: wrap; flex: 1;
}

.info-chip {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500;
  padding: 2px 7px;
  border-radius: var(--r-sm);
  background: var(--ink-50);
  color: var(--ink-600);
  border: 1px solid var(--ink-100);
}

.info-chip.m {
  background: rgba(184,107,74,0.06);
  color: var(--earth-terra);
  border-color: rgba(184,107,74,0.18);
}

/* Actor letter-circles */
.actors {
  display: flex; gap: 3px;
  margin-left: auto;
  flex-shrink: 0;
  align-items: center;
}

.actor-chip {
  font-family: var(--f-mono);
  width: 18px; height: 18px; border-radius: 50%;
  font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 0;
  cursor: help;
}

.actor-c { background: var(--earth-terra); color: var(--cream); }
.actor-b { background: var(--earth-slate); color: var(--cream); }
.actor-o { background: var(--earth-olive); color: var(--cream); }
.actor-s { background: var(--earth-plum); color: var(--cream); }
.actor-a { background: var(--ink-800); color: var(--cream); }
.actor-x { background: var(--ink-200); color: var(--ink-700); }

/* ====================================================================
   SUB-MODULES
   ==================================================================== */
.subs {
  margin-top: var(--s3); padding-top: var(--s3);
  border-top: 1px dashed var(--ink-100);
}

.subs-flow {
  display: flex; gap: var(--s2); flex-wrap: wrap; align-items: stretch;
}

.subs-flow .sub {
  flex: 1 1 0; min-width: 68px; position: relative;
}

.subs-flow .sub:not(:last-child)::after {
  content: '';
  position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
  border: 3.5px solid transparent;
  border-left: 4.5px solid var(--ink-200);
}

.subs-grid { display: flex; flex-direction: column; gap: var(--s2); }
.subs-grid-row { display: flex; gap: var(--s2); }
.subs-grid-row .sub { flex: 1; }

.subs-stack { display: flex; flex-direction: column; gap: 0; }
.subs-stack .sub { border-radius: 0; border-bottom: none; }
.subs-stack .sub:first-child { border-top-left-radius: var(--r-sm); border-top-right-radius: var(--r-sm); }
.subs-stack .sub:last-child { border-bottom-left-radius: var(--r-sm); border-bottom-right-radius: var(--r-sm); border-bottom: 1px solid var(--ink-100); }

.sub {
  background: var(--cream);
  border: 1px solid var(--ink-100);
  border-radius: var(--r-sm);
  padding: var(--s2) var(--s3);
  transition: all 150ms ease;
}

.sub:hover {
  background: var(--paper);
  border-color: var(--ink-200);
  box-shadow: var(--sh-xs);
}

.sub-name {
  font-family: var(--f-body);
  font-size: 12px; font-weight: 600; color: var(--ink-700);
}

.sub-desc {
  font-size: 11px; color: var(--ink-400); margin-top: 1px; line-height: 1.4;
}

/* ====================================================================
   INLINE RISK BOX
   ==================================================================== */
.rbox {
  margin-top: var(--s3); padding: var(--s3);
  border-radius: var(--r-sm); font-size: 11px; line-height: 1.55;
}

.rbox.rH { background: var(--rH-bg); border: 1px solid var(--rH-bdr); }
.rbox.rM { background: var(--rM-bg); border: 1px solid var(--rM-bdr); }
.rbox.rL { background: var(--rL-bg); border: 1px solid var(--rL-bdr); }

.rbox .rt {
  font-family: var(--f-mono); font-weight: 700; font-size: 10px;
  margin-bottom: 2px; letter-spacing: 0.02em;
}

.rbox.rH .rt { color: var(--rH); }
.rbox.rM .rt { color: var(--rM); }
.rbox.rL .rt { color: var(--rL); }

.rbox .rd { color: var(--ink-600); }
.rbox .rs { margin-top: var(--s1); color: var(--ink-700); font-weight: 500; }
.rbox .rs::before { content: '→ '; color: var(--ink-300); }

/* ====================================================================
   SVG CONNECTIONS
   ==================================================================== */
.csvg {
  position: absolute; top: 0; left: 0;
  pointer-events: none; z-index: 10;
  transition: opacity 250ms ease;
}

.cp { fill: none; stroke-width: 1.5; opacity: 0.45; transition: opacity 200ms ease, stroke-width 200ms ease; }
.cp.dep { stroke: var(--cDep); }
.cp.flow { stroke: var(--cFlow); stroke-dasharray: 8 4; }
.cp.call { stroke: var(--cCall); stroke-dasharray: 4 3; }

.ct {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500; fill: var(--ink-400);
  paint-order: stroke; stroke: var(--cream); stroke-width: 4px;
  transition: opacity 200ms ease;
}

.ca.dep { fill: var(--cDep); opacity: 0.45; }
.ca.flow { fill: var(--cFlow); opacity: 0.45; }
.ca.call { fill: var(--cCall); opacity: 0.45; }

/* ====================================================================
   SEARCH / FILTER STATES
   ==================================================================== */
.card.sm {
  outline: 2px solid var(--earth-terra);
  outline-offset: 3px;
  box-shadow: 0 0 0 6px rgba(184,107,74,0.1);
  animation: warmPulse 1.5s ease 2;
}

@keyframes warmPulse {
  0%,100% { box-shadow: 0 0 0 6px rgba(184,107,74,0.1); }
  50% { box-shadow: 0 0 0 12px rgba(184,107,74,0.04); }
}

.card.sd { opacity: 0.1; transform: scale(0.97); }
.card.fd { opacity: 0.1; }
.card.ad { opacity: 0.12; }

/* ====================================================================
   FOCUS MODE — upstream/downstream highlighting
   ==================================================================== */
body.focus-mode .card { opacity: 0.12; }
body.focus-mode .card.focused {
  opacity: 1;
  outline: 2px solid var(--earth-terra);
  outline-offset: 3px;
  box-shadow: 0 0 0 6px rgba(184,107,74,0.08), var(--sh-lg);
}
body.focus-mode .card.linked-up {
  opacity: 1;
  outline: 1.5px solid var(--earth-slate);
  outline-offset: 2px;
}
body.focus-mode .card.linked-down {
  opacity: 1;
  outline: 1.5px solid var(--earth-sage);
  outline-offset: 2px;
}
body.focus-mode .cp { opacity: 0.08; }
body.focus-mode .cp.active { opacity: 1; stroke-width: 2.2; }
body.focus-mode .ct { opacity: 0.1; }
body.focus-mode .ct.active { opacity: 1; }

/* ====================================================================
   RIGHT-SIDE RISK DRAWER (default hidden, toggled via toolbar button)
   ==================================================================== */
.rpanel-scrim {
  position: fixed; inset: 0;
  background: rgba(27,24,20,0.18);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 290;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms var(--ease);
}

.rpanel-scrim.show {
  opacity: 1;
  pointer-events: auto;
}

.rpanel {
  position: fixed; top: 0; right: 0; bottom: 0;
  z-index: 300;
  width: 320px; max-width: 90vw;
  background: rgba(255,255,255,0.98);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-left: 1px solid var(--ink-100);
  box-shadow: -12px 0 40px -8px rgba(27,24,20,0.14);
  display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform 320ms var(--ease);
}

.rpanel.show { transform: translateX(0); }

.rpanel-head {
  padding: var(--s4) var(--s5);
  display: flex; align-items: center; gap: var(--s3);
  border-bottom: 1px solid var(--ink-100);
  background: var(--cream);
}

.rpanel-brow {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--earth-terra);
}

.rpanel-title {
  font-family: var(--f-display);
  font-size: 16px; font-weight: 800;
  color: var(--ink-800);
  letter-spacing: -0.01em;
  margin-top: 2px;
}

.rpanel-title-wrap { flex: 1; }

.rpanel-count {
  font-family: var(--f-mono);
  font-size: 11px; font-weight: 600;
  color: var(--ink-400);
  padding: 3px 8px;
  background: var(--paper);
  border: 1px solid var(--ink-150);
  border-radius: var(--r-pill);
  flex-shrink: 0;
}

.rpanel-close {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--ink-150);
  background: var(--paper);
  color: var(--ink-500);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 150ms ease;
  flex-shrink: 0;
}

.rpanel-close:hover {
  background: var(--ink-800); color: var(--cream);
  border-color: var(--ink-800);
}

.rpanel-body {
  padding: var(--s5);
  overflow-y: auto;
  flex: 1;
}

.rpanel-empty {
  font-family: var(--f-display); font-style: italic;
  color: var(--ink-400); font-size: 13px;
  text-align: center; padding: var(--s10) var(--s4);
}

.rgroup { margin-bottom: var(--s5); }

.rgroup-head {
  font-family: var(--f-mono);
  font-size: 10px; font-weight: 700;
  color: var(--ink-500);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: var(--s3);
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--ink-100);
  display: flex; align-items: center; gap: var(--s2);
}

.rgroup-count {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 600;
  color: var(--ink-300);
  margin-left: auto;
}

.ritem {
  font-family: var(--f-body);
  font-size: 12px;
  padding: var(--s3);
  border: 1px solid var(--ink-100);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all 180ms ease;
  margin-bottom: var(--s2);
  background: var(--paper);
  display: block;
}

.ritem:hover {
  border-color: var(--ink-200);
  box-shadow: var(--sh-sm);
  transform: translateY(-1px);
}

.ritem.high { border-left: 3px solid var(--rH); }
.ritem.medium { border-left: 3px solid var(--rM); }
.ritem.low { border-left: 3px solid var(--rL); }

.ritem-top {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: 4px;
}

.ritem-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}

.ritem-dot.high { background: var(--rH); }
.ritem-dot.medium { background: var(--rM); }
.ritem-dot.low { background: var(--rL); }

.ritem-name {
  color: var(--ink-800); font-weight: 700;
  font-size: 12.5px;
  flex: 1;
}

.ritem-level {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: var(--r-pill);
}

.ritem-level.high { background: var(--rH-bg); color: var(--rH); border: 1px solid var(--rH-bdr); }
.ritem-level.medium { background: var(--rM-bg); color: var(--rM); border: 1px solid var(--rM-bdr); }
.ritem-level.low { background: var(--rL-bg); color: var(--rL); border: 1px solid var(--rL-bdr); }

.ritem-desc {
  font-size: 11.5px; color: var(--ink-500);
  line-height: 1.55;
  margin-top: 2px;
}

/* ====================================================================
   MINI-MAP
   ==================================================================== */
.minimap {
  position: fixed; bottom: var(--s5); right: var(--s5);
  z-index: 150;
  width: 160px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--ink-100);
  border-radius: var(--r-md);
  box-shadow: var(--sh-md);
  padding: 20px 6px 6px;
  overflow: hidden;
}

.minimap-label {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 4px 8px;
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 600;
  color: var(--ink-400);
  letter-spacing: 0.08em; text-transform: uppercase;
  border-bottom: 1px solid var(--ink-100);
  background: var(--cream);
}

.minimap-inner {
  position: relative;
  width: 100%; min-height: 80px;
}

.mm-layer {
  background: var(--ink-50);
  border-left: 2px solid var(--ink-200);
  border-radius: 2px;
  margin-bottom: 2px;
  position: relative;
}

.mm-module {
  background: var(--ink-200);
  border-radius: 1px;
  position: absolute;
}

.mm-module.high { background: var(--rH); }
.mm-module.medium { background: var(--rM); }
.mm-module.low { background: var(--rL); }

.mm-vp {
  position: absolute;
  border: 1.5px solid var(--earth-terra);
  background: rgba(184,107,74,0.08);
  pointer-events: none;
  z-index: 2;
}

/* ====================================================================
   LEGEND
   ==================================================================== */
.legend {
  position: fixed; bottom: var(--s5); left: var(--s5); z-index: 150;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--r-md);
  padding: var(--s4) var(--s5);
  box-shadow: var(--sh-md);
  border: 1px solid var(--ink-100);
  max-width: 220px;
  transition: all 250ms var(--ease);
}

.legend-x {
  position: absolute; top: -8px; right: -8px;
  width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid var(--ink-150); background: var(--paper);
  font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--sh-sm); color: var(--ink-500);
}

.legend-x:hover { background: var(--ink-50); }

.legend.col {
  padding: var(--s2);
  max-width: 40px;
}

.legend.col .lb, .legend.col h4 { display: none; }

.legend h4 {
  font-family: var(--f-display);
  font-size: 12px; font-weight: 800; color: var(--ink-700);
  margin-bottom: var(--s3);
}

.ls { margin-bottom: var(--s2); }

.ls-t {
  font-family: var(--f-mono);
  font-size: 9px; font-weight: 600; color: var(--ink-400);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: var(--s1);
}

.lr {
  display: flex; align-items: center; gap: var(--s2);
  margin-bottom: 3px; font-size: 11px; color: var(--ink-600);
}

.lsw { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.lln { width: 18px; height: 0; flex-shrink: 0; border-top: 2px solid; }
.lln.dsh { border-top-style: dashed; }
.lln.dot { border-top-style: dotted; }
.lhr { margin: var(--s2) 0; border: none; border-top: 1px solid var(--ink-100); }

/* ====================================================================
   EXPORT MASK
   ==================================================================== */
.emask {
  position: fixed; inset: 0;
  background: rgba(27,24,20,0.3);
  backdrop-filter: blur(6px);
  z-index: 9999;
  display: none; place-items: center;
}

.emask.show { display: grid; }

.emask .emsg {
  font-family: var(--f-display);
  background: var(--paper); padding: var(--s5) var(--s8);
  border-radius: var(--r-md); box-shadow: var(--sh-xl);
  font-size: 15px; font-weight: 600; color: var(--ink-700);
}

/* ====================================================================
   PRINT
   ==================================================================== */
@media print {
  .hero, .bridge, .toolbar, .legend, .csvg, .emask, .rpanel, .minimap { display: none !important; }
  body { background: #fff; }
  body::after { display: none; }
  .canvas { padding: 0; transform: none !important; max-width: 100%; }
  .layer { break-inside: avoid; animation: none; opacity: 1; box-shadow: none; border: 1px solid #ddd; }
  .card { break-inside: avoid; animation: none; opacity: 1; box-shadow: none; border: 1px solid #ddd; }
}
</style>
</head>
<body>

<section class="hero" id="hero"></section>
<div class="bridge"></div>

<section class="ov-section" id="ov"></section>
<div class="ov-detail-head">详细视图 · Detail View</div>

<nav class="toolbar" id="toolbar">
  <div class="tb-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="si" placeholder="搜索模块..." />
  </div>
  <div class="tb-group">
    <span class="tb-lbl">Risk</span>
    <button class="pill on" data-f="all" onclick="flt('all')">ALL</button>
    <button class="pill" data-f="high" onclick="flt('high')">HIGH</button>
    <button class="pill" data-f="medium" onclick="flt('medium')">MED</button>
    <button class="pill" data-f="low" onclick="flt('low')">LOW</button>
  </div>
  <div class="tb-group" id="actorGroup">
    <span class="tb-lbl">Actor</span>
  </div>
  <div class="tb-right">
    <div class="tb-zoom">
      <button class="tb-zbtn" onclick="zBy(-0.1)">−</button>
      <span class="tb-zval" id="zv">100%</span>
      <button class="tb-zbtn" onclick="zBy(0.1)">+</button>
      <button class="tb-zbtn" onclick="zRst()">↺</button>
    </div>
    <button class="tb-export" onclick="expPNG()">↓ Export</button>
    <button class="tb-risk" id="riskBtn" onclick="toggleRiskDrawer()" title="查看风险清单">
      <span>⚠ Risks</span>
      <span class="tb-risk-badge" id="riskBtnBadge">0</span>
    </button>
  </div>
</nav>

<div class="canvas-wrap">
  <div class="canvas" id="cv"></div>
  <svg class="csvg" id="csvg"></svg>
</div>

<div class="rpanel-scrim" id="rpanelScrim" onclick="toggleRiskDrawer()"></div>
<aside class="rpanel" id="rpanel"></aside>
<aside class="minimap" id="minimap"></aside>
<aside class="legend" id="leg"></aside>

  const rs = D.risks||[];
  const hR = rs.filter(r => r.level === 'high');

  let chips = '';
  hR.forEach(r => {

  });
  const MAX_MED = 8;
  mR.slice(0, MAX_MED).forEach(r => {

function render() {
  const cv = document.getElementById('cv');
  cv.innerHTML = '';
  const cols = mc();
  let ci = 0;

  D.layers.forEach((layer,i) => {
    const a = LA[i%LA.length];
    const el = document.createElement('div');
    el.className = 'layer';
    el.style.borderLeftColor = a.c;
    el.style.animationDelay = (0.05 + i*0.08) + 's';

    const head = document.createElement('div');
    head.className = 'layer-head';
    head.innerHTML = `<span class="layer-name">${escapeHTML(layer.name)}</span>
      <span class="layer-tag">${layer.modules.length} modules</span>`;
    el.appendChild(head);

    const g = document.createElement('div');
    g.className = 'mgrid';
    g.style.setProperty('--cols', cols);

    layer.modules.forEach(mod => {
      const card = mkCard(mod, ci++);
      card.style.gridColumn = 'span ' + (mod.span || 1);
      g.appendChild(card);
    });

    el.appendChild(g);
    cv.appendChild(el);
  });
}

function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

    c.appendChild(ib);
  }

  /* submodules */
  if (mod.submodules && mod.submodules.length) {
    const area = document.createElement('div');
    area.className = 'subs';
    const lt = mod.sub_layout || 'flow';

    if (lt === 'grid' && mod.sub_rows) {
      const w = document.createElement('div');
      w.className = 'subs-grid';
      mod.sub_rows.forEach(idxs => {
        const row = document.createElement('div');
        row.className = 'subs-grid-row';
        idxs.forEach(i => { if (mod.submodules[i]) row.appendChild(mkSub(mod.submodules[i])); });
        w.appendChild(row);
      });
      area.appendChild(w);
    } else {
      const w = document.createElement('div');
      w.className = 'subs-' + lt;
      mod.submodules.forEach(s => w.appendChild(mkSub(s)));
      area.appendChild(w);
    }
    c.appendChild(area);
  }

  /* inline risk box */
  const ri = RM[mod.name];
  if (ri) {
    const box = document.createElement('div');
    const cls = ri.level === 'high' ? 'rH' : ri.level === 'medium' ? 'rM' : 'rL';
    box.className = 'rbox ' + cls;
    const ll = {high:'⚠ HIGH RISK', medium:'◆ MEDIUM', low:'ℹ LOW'};
    box.innerHTML = `<div class="rt">${ll[ri.level]||''} · ${escapeHTML(ri.type||'')}</div>`
      + `<div class="rd">${escapeHTML(ri.description||'')}</div>`
      + (ri.suggestion ? `<div class="rs">${escapeHTML(ri.suggestion)}</div>` : '');
    c.appendChild(box);
  }

  /* click to focus */
  c.addEventListener('click', (e) => {
    if (e.target.closest('.sub, .actor-chip')) return;
    toggleFocus(mod.name);
  });

  return c;
}

function mkSub(s) {
  const el = document.createElement('div');
  el.className = 'sub';
  const desc = s.description ? `<div class="sub-desc">${escapeHTML(s.description)}</div>` : '';
  el.innerHTML = `<div class="sub-name">${escapeHTML(s.name)}</div>${desc}`;
  return el;
}

/* =========================================================
   CONNECTIONS
   ========================================================= */
function drawC() {
  const svg = document.getElementById('csvg');
  const cv = document.getElementById('cv');
  const wrap = document.querySelector('.canvas-wrap');
  const wR = wrap.getBoundingClientRect();
  const cvR = cv.getBoundingClientRect();

  const dH = Math.max(cv.scrollHeight * sc + 100, wR.height);
  const dW = Math.max(document.body.scrollWidth, cvR.width);

  svg.setAttribute('width', dW);
  svg.setAttribute('height', dH);
  svg.style.width = dW + 'px';
  svg.style.height = dH + 'px';
  svg.innerHTML = '';

  if (!D.connections || !D.connections.length) return;

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  ['dep','flow','call'].forEach(t => {
    const mk = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
    mk.setAttribute('id', 'a-'+t);
    mk.setAttribute('markerWidth', '8');
    mk.setAttribute('markerHeight', '6');
    mk.setAttribute('refX', '8');
    mk.setAttribute('refY', '3');
    mk.setAttribute('orient', 'auto');
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', '0 0, 8 3, 0 6');
    pg.setAttribute('class', 'ca ' + t);
    mk.appendChild(pg);
    defs.appendChild(mk);
  });
  svg.appendChild(defs);

  const tm = {dependency:'dep', data_flow:'flow', call:'call'};
  const wrapRect = wrap.getBoundingClientRect();

  D.connections.forEach(cn => {
    const fe = document.querySelector('.card[data-name="' + CSS.escape(cn.from) + '"]');
    const te = document.querySelector('.card[data-name="' + CSS.escape(cn.to) + '"]');
    if (!fe || !te) return;

    const fR = fe.getBoundingClientRect();
    const tR = te.getBoundingClientRect();

    const x1 = fR.left + fR.width/2 - wrapRect.left;
    const y1 = fR.bottom - wrapRect.top;
    const x2 = tR.left + tR.width/2 - wrapRect.left;
    const y2 = tR.top - wrapRect.top;
    const my = (y1 + y2) / 2;
    const ct = tm[cn.type || 'dependency'] || 'dep';

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    p.setAttribute('class', 'cp ' + ct);
    p.dataset.from = cn.from;
    p.dataset.to = cn.to;
    p.setAttribute('marker-end', 'url(#a-' + ct + ')');
    svg.appendChild(p);

    if (cn.label) {
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', (x1 + x2) / 2);
      txt.setAttribute('y', my - 6);
      txt.setAttribute('class', 'ct');
      txt.setAttribute('text-anchor', 'middle');
      txt.dataset.from = cn.from;
      txt.dataset.to = cn.to;
      txt.textContent = cn.label;
      svg.appendChild(txt);
    }
  });

  if (focusedName) applyFocusClasses();
}

/* =========================================================
   FOCUS MODE
   ========================================================= */
function toggleFocus(name) {
  if (focusedName === name) {
    clearFocus();
  } else {
    focusedName = name;
    document.body.classList.add('focus-mode');
    applyFocusClasses();
  }
}

function clearFocus() {
  focusedName = null;
  document.body.classList.remove('focus-mode');
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('focused','linked-up','linked-down');
  });
  document.querySelectorAll('.cp, .ct').forEach(el => el.classList.remove('active'));
}

function applyFocusClasses() {
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('focused','linked-up','linked-down');
  });
  document.querySelectorAll('.cp, .ct').forEach(el => el.classList.remove('active'));

  if (!focusedName) return;

  const ups = (upMap[focusedName] || []);
  const downs = (downMap[focusedName] || []);

  document.querySelectorAll('.card').forEach(el => {
    const n = el.dataset.name;
    if (n === focusedName) el.classList.add('focused');
    else if (ups.includes(n)) el.classList.add('linked-up');
    else if (downs.includes(n)) el.classList.add('linked-down');
  });

  document.querySelectorAll('.cp, .ct').forEach(el => {
    if (el.dataset.from === focusedName || el.dataset.to === focusedName) {
      el.classList.add('active');
    }
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const drawer = document.getElementById('rpanel');
    if (drawer && drawer.classList.contains('show')) {
      toggleRiskDrawer();
      return;
    }
    if (focusedName) clearFocus();
  }
});

function scrollToCard(name) {
  const el = document.querySelector('.card[data-name="' + CSS.escape(name) + '"]');
  if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('sm');
  setTimeout(() => el.classList.remove('sm'), 3000);
}

/* =========================================================
   ZOOM
   ========================================================= */
function aZ() {
  document.getElementById('cv').style.transform = 'scale(' + sc + ')';
  document.getElementById('zv').textContent = Math.round(sc * 100) + '%';
  requestAnimationFrame(() => { drawC(); updateMinimap(); });
}

function zBy(d) { sc = Math.max(0.3, Math.min(2, sc + d)); aZ(); }
function zRst() { sc = 1; aZ(); window.scrollTo({top:0, behavior:'smooth'}); }

window.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zBy(e.deltaY > 0 ? -0.05 : 0.05);
  }
}, {passive:false});

/* =========================================================
   SEARCH
   ========================================================= */
document.getElementById('si').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let found = false;
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('sm', 'sd');
    if (q && el.dataset.name.toLowerCase().includes(q)) {
      el.classList.add('sm');
      if (!found) {
        el.scrollIntoView({behavior:'smooth', block:'center'});
        found = true;
      }
    } else if (q) {
      el.classList.add('sd');
    }
  });
});

/* =========================================================
   RISK FILTER
   ========================================================= */
function flt(lv) {
  document.querySelectorAll('.tb-group [data-f]').forEach(b => {
    b.className = 'pill';
    if (b.dataset.f === lv) {
      if (lv === 'all') b.classList.add('on');
      else if (lv === 'high') b.classList.add('on-h');
      else if (lv === 'medium') b.classList.add('on-m');
      else b.classList.add('on-l');
    }
  });
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('fd');
    if (lv === 'all') return;
    const r = RM[el.dataset.name];
    if (!r || r.level !== lv) el.classList.add('fd');
  });
}

/* =========================================================
   ACTOR FILTER
   ========================================================= */
function renderActorPills() {
  const existing = new Set();
  D.layers.forEach(l => l.modules.forEach(m => (m.actors || []).forEach(a => existing.add(a))));

  const grp = document.getElementById('actorGroup');
  const order = ['c_user','b_user','operator','customer_service','admin','external_system'];
  const items = order.filter(k => existing.has(k));

  if (!items.length) { grp.style.display = 'none'; return; }

  let html = '<span class="tb-lbl">Actor</span>';
  html += '<button class="pill on" data-a="all" onclick="actFlt(\'all\')">ALL</button>';
  items.forEach(k => {
    const cfg = ACT[k];
    html += `<button class="pill" data-a="${k}" onclick="actFlt('${k}')" title="${cfg.label}">${cfg.letter}</button>`;
  });
  grp.innerHTML = html;
}

function actFlt(a) {
  activeActor = (a === 'all') ? null : a;
  document.querySelectorAll('#actorGroup [data-a]').forEach(b => {
    b.classList.remove('on');
    if (b.dataset.a === a) b.classList.add('on');
  });
  document.querySelectorAll('.card').forEach(el => {
    el.classList.remove('ad');
    if (!activeActor) return;
    const actors = (el.dataset.actors || '').split(',').filter(Boolean);
    if (!actors.includes(activeActor)) el.classList.add('ad');
  });
}

/* =========================================================
   RISK DRAWER (toggled via toolbar button)
   ========================================================= */
function renderRiskPanel() {
  const el = document.getElementById('rpanel');
  const btn = document.getElementById('riskBtn');
  const badge = document.getElementById('riskBtnBadge');
  const risks = D.risks || [];

  /* Update toolbar badge */
  badge.textContent = risks.length;
  const hasHigh = risks.some(r => r.level === 'high');
  if (hasHigh) btn.classList.add('has-h');
  if (!risks.length) btn.style.display = 'none';

  /* Group by type, order by level severity within each group */
  const byType = {};
  risks.forEach(r => {
    const t = r.type || '其他';
    (byType[t] = byType[t] || []).push(r);
  });
  const lvlOrder = {high:0, medium:1, low:2};
  Object.keys(byType).forEach(t => byType[t].sort((a,b) => (lvlOrder[a.level]||9) - (lvlOrder[b.level]||9)));

  let body = '';
  if (!risks.length) {
    body = '<div class="rpanel-empty">暂无标注风险</div>';
  } else {
    /* Sort types by whether they contain high-risk items */
    const typeOrder = Object.keys(byType).sort((a,b) => {
      const aHasH = byType[a].some(r => r.level === 'high') ? 0 : 1;
      const bHasH = byType[b].some(r => r.level === 'high') ? 0 : 1;
      return aHasH - bHasH;
    });

    typeOrder.forEach(type => {
      const items = byType[type];
      body += `<div class="rgroup"><div class="rgroup-head">
        <span>${escapeHTML(type)}</span>
        <span class="rgroup-count">${items.length}</span>
      </div>`;
      items.forEach(r => {
        const safeModule = r.module.replace(/'/g, "\\'");
        const lvlLabel = r.level === 'high' ? 'HIGH' : r.level === 'medium' ? 'MED' : 'LOW';
        body += `<div class="ritem ${r.level}" onclick="scrollToCardAndClose('${safeModule}')">
          <div class="ritem-top">
            <span class="ritem-name">${escapeHTML(r.module)}</span>
            <span class="ritem-level ${r.level}">${lvlLabel}</span>
          </div>
          <div class="ritem-desc">${escapeHTML(r.description || '')}</div>
        </div>`;
      });
      body += '</div>';
    });
  }

  el.innerHTML = `
    <div class="rpanel-head">
      <div class="rpanel-title-wrap">
        <div class="rpanel-brow">Risk Register</div>
        <div class="rpanel-title">风险清单</div>
      </div>
      <span class="rpanel-count">${risks.length}</span>
      <button class="rpanel-close" onclick="toggleRiskDrawer()" title="关闭">×</button>
    </div>
    <div class="rpanel-body">${body}</div>
  `;
}

function toggleRiskDrawer() {
  const el = document.getElementById('rpanel');
  const scrim = document.getElementById('rpanelScrim');
  const isOpen = el.classList.toggle('show');
  scrim.classList.toggle('show', isOpen);
}

function scrollToCardAndClose(name) {
  toggleRiskDrawer();
  setTimeout(() => scrollToCard(name), 200);
}

/* =========================================================
   MINIMAP
   ========================================================= */
function renderMinimap() {
  const mm = document.getElementById('minimap');
  mm.innerHTML = '<div class="minimap-label">Overview</div><div class="minimap-inner" id="mmInner"></div>';

  const inner = document.getElementById('mmInner');
  const mmWidth = mm.clientWidth - 20; /* padding */

  const cols = mc();
  let totalH = 0;

  D.layers.forEach((layer, li) => {
    /* compute per-layer height relative */
    const rowH = 18;
    const lyr = document.createElement('div');
    lyr.className = 'mm-layer';
    lyr.style.height = rowH + 'px';
    lyr.style.borderLeftColor = LA[li % LA.length].c;

    let colPos = 0;
    layer.modules.forEach(mod => {
      const span = mod.span || 1;
      const w = (span / cols) * mmWidth * 0.9;
      const x = (colPos / cols) * mmWidth * 0.9 + 4;
      colPos += span;

      const risk = mod.risk || (RM[mod.name] ? RM[mod.name].level : null);
      const el = document.createElement('div');
      el.className = 'mm-module' + (risk ? ' ' + risk : '');
      el.style.left = x + 'px';
      el.style.top = '3px';
      el.style.width = Math.max(w - 2, 4) + 'px';
      el.style.height = (rowH - 6) + 'px';
      el.title = mod.name;
      lyr.appendChild(el);
    });

    inner.appendChild(lyr);
    totalH += rowH + 2;
  });

  const vp = document.createElement('div');
  vp.className = 'mm-vp';
  vp.id = 'mmvp';
  inner.appendChild(vp);

  minimapScale = totalH / Math.max(document.getElementById('cv').scrollHeight * sc, 1);
  updateMinimap();
}

function updateMinimap() {
  const vp = document.getElementById('mmvp');
  if (!vp) return;
  const cv = document.getElementById('cv');
  const inner = document.getElementById('mmInner');
  if (!inner) return;

  const cvH = cv.scrollHeight * sc;
  const totalH = inner.offsetHeight || 80;
  const s = totalH / Math.max(cvH, 1);

  const vpTop = window.scrollY * s;
  const vpH = window.innerHeight * s;

  vp.style.left = '0';
  vp.style.right = '0';
  vp.style.top = Math.max(0, vpTop) + 'px';
  vp.style.height = Math.min(vpH, totalH - vpTop) + 'px';
}

document.getElementById('minimap').addEventListener('click', e => {
  const inner = document.getElementById('mmInner');
  if (!inner) return;
  const r = inner.getBoundingClientRect();
  const y = e.clientY - r.top;
  const totalH = inner.offsetHeight || 80;
  const cvH = document.getElementById('cv').scrollHeight * sc;
  const targetScroll = (y / totalH) * cvH - window.innerHeight / 2;
  window.scrollTo({top: Math.max(0, targetScroll), behavior: 'smooth'});
});

/* =========================================================
   LEGEND

function tgLeg() {
  const lg = document.getElementById('leg');
  lg.classList.toggle('col');
  lg.querySelector('.legend-x').textContent = lg.classList.contains('col') ? '☰' : '×';
}

/* =========================================================
   EXPORT
   ========================================================= */
async function expPNG() {
  const mask = document.getElementById('em');
  mask.classList.add('show');
  try {
    if (!window.html2canvas) {
      await new Promise((ok, no) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload = ok;
        s.onerror = () => no(new Error('CDN'));
        document.head.appendChild(s);
      });
    }
    const csvg = document.getElementById('csvg');
    csvg.style.display = 'none';

    const result = await html2canvas(document.getElementById('cv'), {
      scale: 2,
      backgroundColor: '#FAF9F6',
      useCORS: true,
      logging: false,
    });

    csvg.style.display = '';
    const a = document.createElement('a');
    a.download = (D.title || 'Architecture') + '.png';
    a.href = result.toDataURL('image/png');
    a.click();
  } catch(e) {
    alert('Export requires network access. Use Ctrl/Cmd+P for PDF instead.');
  } finally {
    mask.classList.remove('show');
  }
}

/* =========================================================
   OVERVIEW
   ========================================================= */
function renderOverview() {
  const el = document.getElementById('ov');
  let h = '<div class="ov-section-label">架构总览 Overview</div>';

  D.layers.forEach((layer, i) => {
    const a = LA[i % LA.length];
    let lCols = 0;
    layer.modules.forEach(m => { lCols += (m.span || 1); });
    lCols = Math.max(lCols, 1);

    h += `<div class="ov-layer-row">`;
    h += `<div class="ov-layer-label" style="color:${a.c};border-right-color:${a.c}50">${escapeHTML(layer.name)}</div>`;
    h += `<div class="ov-mods-grid" style="--ov-cols:${lCols}">`;

    layer.modules.forEach(mod => {
      const risk = mod.risk || (RM[mod.name] ? RM[mod.name].level : null);
      const rCls = risk ? ` risk-${risk}` : '';
      const span = mod.span || 1;

      h += `<div class="ov-mod-card${rCls}" style="grid-column:span ${span}">`;
      h += `<div class="ov-mod-top"><div class="ov-mod-name">${escapeHTML(mod.name)}</div>`;
      if (M === 'priority' && mod.priority) {
        h += `<span class="ov-badge ov-badge-${mod.priority.toLowerCase()}">${escapeHTML(mod.priority)}</span>`;
      }
      h += `</div>`;

      if (mod.submodules && mod.submodules.length) {
        h += '<div class="ov-sub-list">';
        mod.submodules.forEach(s => {
          h += `<div class="ov-sub-item">${escapeHTML(s.name)}</div>`;
        });
        h += '</div>';
      }

      h += '</div>';
    });

    h += '</div></div>';
  });

  el.innerHTML = h;
}

window.addEventListener('resize', () => requestAnimationFrame(() => { drawC(); renderMinimap(); }));
window.addEventListener('scroll', () => requestAnimationFrame(updateMinimap));

renderOverview();
renderHero();
render();
renderActorPills();
renderRiskPanel();
renderLegend();
requestAnimationFrame(() => { drawC(); renderMinimap(); });
